<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💕</title>

<!-- BEAUTIFUL FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    font-family: "Playfair Display", serif;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.8), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(255,190,210,0.35), transparent 30%),
        linear-gradient(135deg, #fff7f8, #fbe8ed, #fffaf5);

    color: #684a54;
}


/* =========================
   FLOATING DECORATIONS
========================= */

.decorations {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.float {
    position: absolute;
    opacity: 0;
    animation: floatUp linear infinite;
}

.heart {
    font-size: 20px;
}

.star {
    font-size: 15px;
}

.flower {
    font-size: 18px;
}

.sparkle {
    font-size: 13px;
}

.float:nth-child(1) {
    left: 5%;
    animation-duration: 10s;
    animation-delay: 0s;
}

.float:nth-child(2) {
    left: 17%;
    animation-duration: 13s;
    animation-delay: 3s;
}

.float:nth-child(3) {
    left: 30%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.float:nth-child(4) {
    left: 44%;
    animation-duration: 14s;
    animation-delay: 5s;
}

.float:nth-child(5) {
    left: 58%;
    animation-duration: 11s;
    animation-delay: 2s;
}

.float:nth-child(6) {
    left: 72%;
    animation-duration: 12s;
    animation-delay: 4s;
}

.float:nth-child(7) {
    left: 86%;
    animation-duration: 10s;
    animation-delay: 1s;
}

.float:nth-child(8) {
    left: 94%;
    animation-duration: 15s;
    animation-delay: 6s;
}

.float:nth-child(9) {
    left: 25%;
    animation-duration: 12s;
    animation-delay: 7s;
}

.float:nth-child(10) {
    left: 65%;
    animation-duration: 9s;
    animation-delay: 5s;
}

@keyframes floatUp {

    0% {
        bottom: -10%;
        transform: translateX(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 0.55;
    }

    50% {
        transform: translateX(30px) rotate(15deg);
        opacity: 0.7;
    }

    80% {
        opacity: 0.45;
    }

    100% {
        bottom: 110%;
        transform: translateX(-30px) rotate(-20deg);
        opacity: 0;
    }
}


/* =========================
   SOFT GLOW
========================= */

.glow {
    position: fixed;
    width: 260px;
    height: 260px;
    border-radius: 50%;

    background: rgba(255, 180, 200, 0.18);

    filter: blur(50px);

    top: -80px;
    left: -80px;

    pointer-events: none;
}

.glow2 {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;

    background: rgba(255, 215, 180, 0.18);

    filter: blur(60px);

    right: -100px;
    bottom: -100px;

    pointer-events: none;
}


/* =========================
   MAIN LOGIN AREA
========================= */

.page {
    position: relative;
    z-index: 5;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;
}


/* =========================
   LOGIN CARD
========================= */

.login-box {

    width: 100%;
    max-width: 430px;

    text-align: center;

    padding: 48px 30px 42px;

    background: rgba(255,255,255,0.62);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.75);

    border-radius: 32px;

    box-shadow:
        0 20px 60px rgba(110,70,80,0.12);

    animation: appear 1.3s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================
   TOP DECORATION
========================= */

.top-heart {
    font-size: 27px;

    margin-bottom: 12px;

    animation: heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}


.small-title {

    font-size: 13px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #a27682;

    margin-bottom: 13px;
}


/* BEAUTIFUL SCRIPT FONT */

h1 {

    font-family: "Great Vibes", cursive;

    font-size: 58px;

    font-weight: 400;

    margin: 0 0 14px;

    color: #8d5969;

    line-height: 1.1;
}


/* =========================
   MESSAGE
========================= */

.message {

    font-size: 16px;

    line-height: 1.8;

    color: #765963;

    margin: 0 auto 28px;

    max-width: 320px;
}


/* =========================
   PASSWORD LABEL
========================= */

.label {

    font-size: 12px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #a27682;

    margin-bottom: 9px;
}


/* =========================
   PASSWORD INPUT
========================= */

input {

    width: 100%;

    padding: 15px 18px;

    border-radius: 18px;

    border: 1px solid rgba(160,110,125,0.18);

    background: rgba(255,255,255,0.72);

    outline: none;

    text-align: center;

    font-family: "Playfair Display", serif;

    font-size: 16px;

    color: #684a54;

    transition: 0.3s;
}

input::placeholder {
    color: #b99ca5;
}

input:focus {

    border-color: rgba(160,100,120,0.4);

    box-shadow: 0 0 20px rgba(190,120,140,0.12);
}


/* =========================
   BUTTON
========================= */

button {

    width: 100%;

    margin-top: 15px;

    padding: 15px;

    border: none;

    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #b77b8b,
        #9d6475
    );

    color: white;

    font-family: "Playfair Display", serif;

    font-size: 15px;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow: 0 10px 25px rgba(140,80,100,0.18);

    transition: 0.3s;
}

button:hover {

    transform: translateY(-2px);

    box-shadow: 0 14px 30px rgba(140,80,100,0.24);
}

button:active {
    transform: scale(0.98);
}


/* =========================
   ERROR MESSAGE
========================= */

#error {

    margin-top: 13px;

    min-height: 20px;

    font-size: 13px;

    color: #b66b7b;
}


/* =========================
   BOTTOM DECORATION
========================= */

.bottom-decoration {

    margin-top: 28px;

    font-size: 17px;

    letter-spacing: 9px;

    opacity: 0.55;
}


/* =========================
   UNLOCK ANIMATION
========================= */

.unlock {

    animation: unlock 0.8s ease forwards;
}

@keyframes unlock {

    to {
        opacity: 0;
        transform: scale(1.08);
        filter: blur(8px);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .login-box {
        padding: 40px 24px 34px;
        border-radius: 28px;
    }

    h1 {
        font-size: 52px;
    }

    .message {
        font-size: 15px;
    }
}

</style>
</head>


<body>


<!-- SOFT BACKGROUND GLOWS -->

<div class="glow"></div>
<div class="glow2"></div>


<!-- FLOATING DECORATIONS -->

<div class="decorations">

    <span class="float heart">♡</span>
    <span class="float heart">♥</span>
    <span class="float flower">✿</span>
    <span class="float sparkle">✦</span>
    <span class="float heart">♡</span>
    <span class="float flower">❀</span>
    <span class="float sparkle">✧</span>
    <span class="float heart">♥</span>
    <span class="float flower">✿</span>
    <span class="float sparkle">✦</span>

</div>


<!-- LOGIN PAGE -->

<main class="page">

    <section class="login-box" id="loginBox">

        <div class="top-heart">
            💕
        </div>

        <div class="small-title">
            A little something for you
        </div>

        <h1>
            A Little Surprise
        </h1>

        <p class="message">
            Something special has been waiting here for you...
            <br>
            But first, there's a little secret to unlock. ♡
        </p>


        <div class="label">
            Enter the secret password
        </div>

        <input
            type="password"
            id="password"
            placeholder="Your secret password"
            onkeydown="if(event.key==='Enter') checkPassword()"
        >

        <button onclick="checkPassword()">
            Unlock My Surprise ♡
        </button>

        <div id="error"></div>

        <div class="bottom-decoration">
            ✧ ♡ ✧
        </div>

    </section>

</main>


<script>

/* =========================
   YOUR PASSWORD
========================= */

const correctPassword = "hibamol";


function checkPassword() {

    const enteredPassword =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    const box =
        document.getElementById("loginBox");


    if (enteredPassword === correctPassword) {

        error.innerHTML = "Opening your surprise... ♡";

        error.style.color = "#8d5969";

        box.classList.add("unlock");


        setTimeout(function() {

            window.location.href = "gift.html?v=3";

        }, 800);

    }

    else {

        error.innerHTML =
            "Hmm... that's not the secret password ♡";

        document.getElementById("password").value = "";

    }

}

</script>


</body>
</html>
